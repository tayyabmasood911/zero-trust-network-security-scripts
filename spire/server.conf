server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "enterprise.cloud.corp"
    data_dir = "/var/lib/spire-server/data"
    log_level = "INFO"
    ca_key_type = "ec-p256"
    ca_ttl = "720h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "15m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire-server/data/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire-server/data/keys.json"
        }
    }

    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/etc/spire/certs/intermediate-ca.crt"
            key_file_path = "/etc/spire/certs/intermediate-ca.key"
        }
    }
}
