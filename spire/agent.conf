agent {
    data_dir = "/var/lib/spire/data"
    log_level = "INFO"
    server_address = "spire-server.enterprise.cloud.corp"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_bundle_path = "/etc/spire/certs/ca-bundle.crt"
    trust_domain = "enterprise.cloud.corp"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/data/keys"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
        }
    }

    WorkloadAttestor "docker" {
        plugin_data {}
    }

    WorkloadAttestor "k8s" {
        plugin_data {
            kubelet_read_only_port = "10255"
        }
    }
}
